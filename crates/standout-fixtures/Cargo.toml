[package]
name = "standout-fixtures"
version = "13.0.0"
edition = "2021"
description = "The shared downstream-shaped app fixture the standout test suites assert against"
license = "MIT"
publish = false

[dependencies]
standout = { path = "../standout", version = "13.0.0" }
anyhow = "1"
clap = { version = "4", features = ["help"] }
console = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
