[package]
name = "todo-core"
version.workspace = true
edition = "2021"
description = "CLI-free todo domain and JSON persistence for the Standout worked example"
license = "MIT"
repository = "https://github.com/arthur-debert/standout"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
