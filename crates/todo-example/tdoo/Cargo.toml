[package]
name = "tdoo"
version = "12.0.1"
edition = "2021"
description = "Standout CLI for the two-package todo worked example"
license = "MIT"
publish = false

[dependencies]
todo-core = { path = "../todo-core" }
standout = { path = "../../standout", version = "12.0.1" }
standout-dispatch = { path = "../../standout-dispatch", version = "12.0.1" }
standout-input = { path = "../../standout-input", version = "12.0.1", default-features = false, features = ["simple-prompts"] }

anyhow = "1"
clapfig = "0.26"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
standout-test = { path = "../../standout-test", version = "12.0.1" }
serial_test = "3"
tempfile = "3"
