[package]
name = "tdoo"
version.workspace = true
edition = "2021"
description = "Standout CLI for the two-package todo worked example"
license = "MIT"

[dependencies]
todo-core = { path = "../todo-core", version = "13.0.0" }
standout = { path = "../../standout", version = "13.0.0" }

anyhow = "1"
clapfig = "0.26"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
standout-test = { path = "../../standout-test", version = "13.0.0" }
serial_test = "3"
tempfile = "3"
