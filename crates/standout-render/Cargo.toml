[package]
name = "standout-render"
version.workspace = true
edition = "2021"
description = "Styled terminal rendering with templates, themes, and adaptive color support"
license = "MIT"
keywords = ["cli", "terminal", "colors", "template", "styling"]
categories = ["command-line-interface", "template-engine"]
repository = "https://github.com/arthur-debert/standout"
readme = "README.md"

[dependencies]
console = "0.16"
dark-light = "0.2"
deunicode = "1.6.2"
minijinja = { version = "2", features = ["loader"] }
once_cell = "1.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
csv = "1.3"
unicode-width = "0.2"
east-asian-width = "0.1"
cssparser = "0.31"
terminal_size = "0.4"
standout-bbparser = { version = "13.0.0", path = "../standout-bbparser" }
standout-types = { version = "13.0.0", path = "../standout-types" }
thiserror = "2"

[features]
test-support = []

[dev-dependencies]
tempfile = "3.24.0"
proptest = "1"
serial_test = "3"
