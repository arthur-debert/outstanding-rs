[package]
name = "standout-test"
version = "8.1.1"
edition = "2021"
description = "In-process test harness for applications built with the standout CLI framework"
license = "MIT"
keywords = ["cli", "testing", "harness", "standout"]
categories = ["command-line-interface", "development-tools::testing"]
repository = "https://github.com/arthur-debert/standout"

[dependencies]
standout = { version = "8.1.1", path = "../standout" }
standout-input = { version = "8.1.1", path = "../standout-input" }
standout-render = { version = "8.1.1", path = "../standout-render" }
clap = { version = "4", features = ["derive", "help"] }
console = "0.16"
serial_test = "3"
tempfile = "3"

# run_pty's openpty/termios/ioctl calls; a pty is a Unix object.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
standout-fixtures = { path = "../standout-fixtures" }
insta = "1.46.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
