[package]
name = "standout-macros"
version.workspace = true
edition = "2021"
description = "Proc macros for compile-time resource embedding in Standout"
license = "MIT"
repository = "https://github.com/arthur-debert/standout"
keywords = ["cli", "templates", "macros", "embed"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serial_test = "3"
standout-dispatch = { path = "../standout-dispatch" }
standout-input = { path = "../standout-input" }
tempfile = "3"
trybuild = "1"
