[package]
name = "standout"
version.workspace = true
edition = "2021"
description = "Styled CLI template rendering with automatic terminal detection"
license = "MIT"
keywords = ["cli", "terminal", "colors", "template", "styling"]
categories = ["command-line-interface", "template-engine"]
repository = "https://github.com/arthur-debert/standout"
readme = "README.md"

[dependencies]
# Core rendering (re-exported from standout-render)
standout-render = { version = "13.0.4", path = "../standout-render" }
standout-pipe = { path = "../standout-pipe", version = "13.0.4" }
standout-bbparser = { version = "13.0.4", path = "../standout-bbparser" }
standout-macros = { version = "13.0.4", path = "../standout-macros" }
standout-dispatch = { version = "13.0.4", path = "../standout-dispatch" }
# Heavier input backends (editor — tempfile/which/shell-words; inquire — ~29 deps)
# stay opt-in via the input-editor / input-inquire features below. simple-prompts
# is free (no extra deps) and stays on so basic TextPromptSource works out of
# the box.
standout-input = { version = "13.0.4", path = "../standout-input", default-features = false, features = ["simple-prompts"] }
standout-seeker = { version = "13.0.4", path = "../standout-seeker" }

# Direct dependencies (also used by standout-render, but needed here for cli module)
console = "0.16"
deunicode = "1.6.2"
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Matches rustfmt's width measurement so generated code can predict its
# inline-vs-split formatting decisions (see cli_command_attribute).
unicode-width = "0.2"

# CLI dependencies (formerly optional with clap feature)
clap = { version = "4", features = ["derive", "help", "string"] }
anyhow = "1"
thiserror = "2"
clapfig = "0.26"

[features]
default = []
macros = []
test-support = ["standout-render/test-support"]

# Opt-in input backends. These re-export feature flags from standout-input
# so that depending on `standout` with `features = ["input-editor"]` is
# equivalent to depending on `standout-input` with that feature directly.
input-editor = ["standout-input/editor"]
input-inquire = ["standout-input/inquire"]

[dev-dependencies]
standout-fixtures = { path = "../standout-fixtures" }
standout-test = { path = "../standout-test" }
proptest = "1"
tempfile = "3.24.0"
serial_test = "3"
insta = { version = "1.46.1", features = ["yaml", "json"] }
trybuild = "1"
serde_yaml = "0.9"
csv = "1.3"
toml = "0.8"
