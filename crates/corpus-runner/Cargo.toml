[package]
name = "corpus-runner"
version = "10.0.0"
edition = "2021"
description = "Runner for the downstream-corpus pilot: blind agent runs, instrumented and reported"
license = "MIT"
repository = "https://github.com/arthur-debert/standout"
# In-repo harness, not a product: never published. The version rides the
# workspace bump so `env!("CARGO_PKG_VERSION")` doubles as the default
# framework pin for blind workspaces.
publish = false
# `src/bin/broker_probe.rs` is the credential broker's test fixture, not a
# second entry point: name the runner so `cargo run -p corpus-runner` keeps
# meaning what the docs say it means.
default-run = "corpus-runner"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
standout-input = { path = "../standout-input" }
standout-test = { path = "../standout-test" }
tempfile = "3"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
