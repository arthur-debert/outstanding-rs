name: Publish crates

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CACHE_ON_FAILURE: 'true'
      CARGO_INCREMENTAL: '0'
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CLIENT_SIDE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore release tools
        id: release-tools
        uses: actions/cache/restore@v5
        with:
          path: .quality-tools
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/tool-versions.env', 'scripts/install-release-tools') }}

      - name: Install repository Rust toolchain
        run: |
          rustup show
          # rust-cache starts unawaited cleanup of both optional test directories.
          mkdir -p target/tests/{target,trybuild}
          source scripts/tool-versions.env
          echo "SCCACHE_VERSION=$SCCACHE_VERSION" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false

      - name: Load secrets from Doppler
        uses: DopplerHQ/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ env.DOPPLER_TOKEN }}
          inject-env-vars: true
      - name: Set up shared compiler cache
        uses: arthur-debert/release/.github/actions/setup-sccache@v3
        with:
          gcs-key: ${{ env.SCCACHE_GCS_KEY }}
          key-prefix: ${{ github.repository }}/${{ runner.os }}/${{ runner.arch }}
          version: v${{ env.SCCACHE_VERSION }}
      - name: Install release tools
        run: scripts/with-sccache --keep-server scripts/install-release-tools

      - name: Save installed release tools
        if: steps.release-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .quality-tools
          key: ${{ steps.release-tools.outputs.cache-primary-key }}

      - name: Publish the workspace
        id: publish
        env:
          BUMP: ${{ inputs.bump }}
        run: scripts/release/configure-git scripts/release/publish "$BUMP" --execute --no-confirm

      - name: Preserve release commit after failure
        if: failure() && steps.publish.outcome == 'failure'
        run: git bundle create "$RUNNER_TEMP/release-recovery.bundle" HEAD
      - name: Upload release recovery bundle
        if: failure() && steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery.bundle
          retention-days: 7
