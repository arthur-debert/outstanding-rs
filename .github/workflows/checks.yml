name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run on macOS instead of Linux
        type: boolean
        default: false

concurrency:
  group: checks-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ${{ inputs.macos && 'macos-15' || 'ubuntu-24.04' }}
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CARGO_INCREMENTAL: '0'
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CLIENT_SIDE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Cache quality tools
        uses: actions/cache@v5
        with:
          path: .quality-tools
          key: quality-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-quality-tools', 'scripts/install-sccache', 'scripts/tool-versions.env', 'scripts/quality-tools/package*.json', '.node-version') }}
      - name: Install quality tools
        run: |
          scripts/install-quality-tools
          source scripts/tool-versions.env
          echo "SCCACHE_VERSION=$SCCACHE_VERSION" >> "$GITHUB_ENV"

      - name: Cache Rust toolchain
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install repository Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}
          cache-bin: false

      - name: Load secrets from Doppler
        if: env.DOPPLER_TOKEN != ''
        uses: DopplerHQ/secrets-fetch-action@v2.0.0
        with:
          doppler-token: ${{ env.DOPPLER_TOKEN }}
          inject-env-vars: true
      - name: Set up shared compiler cache
        uses: arthur-debert/release/.github/actions/setup-sccache@v3
        with:
          gcs-key: ${{ env.SCCACHE_GCS_KEY }}
          key-prefix: ${{ github.repository }}/${{ runner.os }}/${{ runner.arch }}
          version: v${{ env.SCCACHE_VERSION }}
      - name: Run repository quality checks
        run: |
          scripts/with-sccache --keep-server scripts/quality
          # rust-cache starts unawaited cleanup of both optional test directories.
          mkdir -p target/tests/{target,trybuild}
