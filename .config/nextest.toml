# Every trybuild `#[test]` in one crate drives the same scratch project under
# `target/tests/trybuild/<crate>`, coordinated across processes only by a
# best-effort lockfile that a second process busts once the holder's 500ms
# heartbeat is 1.5s stale. A loaded full-suite run starves that heartbeat, both
# runs then write the same sources, and the compile-fail cases spuriously
# report "expected to fail to compile, but it succeeded". Run them one at a time.
[test-groups]
trybuild = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(app_builder_gate) or binary(dispatch_derive_rejections) or test(=compile_failures_cover_attribute_misuse)'
test-group = 'trybuild'
