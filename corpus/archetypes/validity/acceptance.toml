# Acceptance suite for the `validity` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (#365).
schema = 1
archetype = "validity"

# --- silent-template family --------------------------------------------------

[[case]]
name = "show-registered-name"
group = "silent-template"
stresses = "the one registered template name renders exact success bytes under text"
expected = "pass"
[case.run]
argv = ["show", "ok", "--output", "text"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "ok\n"
stderr = ""

[[case]]
name = "show-registered-name-term-color-on"
group = "silent-template"
stresses = "the incomplete app theme actually styles the ok tag: term+color carries ANSI, never [ok?]"
expected = "pass"
[case.run]
argv = ["show", "ok", "--output", "term"]
env = { TERM = "xterm-256color", CLICOLOR_FORCE = "1", FORCE_COLOR = "1" }
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_contains = ["ok", "\u001b["]
stdout_not_contains = ["[ok?]", "[about?]", "[header?]"]
stderr = ""

[[case]]
name = "show-mistyped-name"
group = "silent-template"
stresses = "a near-miss registry name fails loudly and bounded: no source dump, no empty success, no hang"
expected = "pass"
[case.run]
argv = ["show", "okk"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr_contains = ["okk"]
stdout_not_contains = ["{{", "{%"]
stderr_not_contains = ["{{", "{%"]

[[case]]
name = "show-missing-name"
group = "silent-template"
stresses = "an unregistered name with no near-match fails the same loud bounded way"
expected = "pass"
[case.run]
argv = ["show", "nosuch"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr_contains = ["nosuch"]
stdout_not_contains = ["{{", "{%"]
stderr_not_contains = ["{{", "{%"]

[[case]]
name = "early-registered-before-templates"
group = "registration-order"
stresses = "a command registered before templates load still renders, never empty or as source"
expected = "pass"
[case.run]
argv = ["early", "--output", "text"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "ok\n"
stderr = ""

[[case]]
name = "late-registered-after-templates"
group = "registration-order"
stresses = "a command registered after templates load renders the same bytes"
expected = "pass"
[case.run]
argv = ["late", "--output", "text"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "ok\n"
stderr = ""

# --- incomplete app theme × framework help -----------------------------------
# Unresolved-tag markers that #303 leaked onto a terminal. Help clap facts
# are Usage plus the command names the page must still present.
# -h/--help short-circuit before --output, so they render Auto. Color-on
# flag cases need a stdout PTY plus a capable TERM; color-off flag cases
# use the same PTY with NO_COLOR so they prove suppression, not the pipe
# default. The help word honors --output and does not need a PTY.

[[case]]
name = "root-h-text-color-off"
group = "themed-help"
stresses = "root -h, text-equivalent (color off): no markers, clap facts present, no ANSI"
expected = "pass"
[case.run]
argv = ["-h"]
env = { TERM = "xterm-256color", NO_COLOR = "1", CLICOLOR_FORCE = "0", FORCE_COLOR = "0" }
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stderr = ""
stdout_contains = ["Usage", "show", "early", "late", "nest"]
stdout_not_contains = [
    "[about?]",
    "[header?]",
    "[usage?]",
    "[item?]",
    "[metavar?]",
    "[desc?]",
    "[default?]",
    "[values?]",
    "[example?]",
    "\u001b[",
]

[[case]]
name = "root-help-flag-text-color-off"
