# --- ROB01 invariant matrix --------------------------------------------------
# Human commands only (text/term): JSON is not a validity-edge surface here.
# Failures are framework findings by default. Help stays in the case suite
# because -h/--help ignore --output, which the matrix always appends.

[invariants]
modes = ["text", "term"]
colors = ["off", "on"]

[[invariants.theme]]
name = "application"

[[invariants.command]]
argv = ["show", "ok"]
contract = "rendered"

[[invariants.command]]
argv = ["early"]
contract = "rendered"

[[invariants.command]]
argv = ["late"]
contract = "rendered"

[[invariants.command]]
argv = ["nest", "inner", "leaf"]
contract = "rendered"
