# Acceptance suite for the `cargolike` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (ROB07-WS03a).
#
# Cases whose assertion depends on config *files* or on the mechanical key↔env
# mapping are expected-fail against PAR01: standout has no configuration layer,
# so a blind implementer either hand-rolls one (the workaround is itself
# instrumentation signal) or the case reads as a framework gap. Cases that hold
# for an implementation ignoring every file layer are expected-pass.
schema = 1
archetype = "cargolike"

# --- the workspace surface ---------------------------------------------------

[[case]]
name = "metadata-plain-when-piped"
group = "workspace-surface"
stresses = "auto output mode degrades to plain text on a piped stdout"
expected = "pass"
[case.run]
argv = ["metadata"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "cli v1.0.0 deps: core util\ncore v0.3.1 deps: none\nutil v0.2.0 deps: core\n"
stderr = ""

[[case]]
name = "metadata-json-is-typed"
group = "workspace-surface"
stresses = "the machine mode carries dependency lists as arrays, not as the text form's words"
expected = "pass"
[case.run]
argv = ["metadata", "--output", "json"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"packages":[{"name":"cli","version":"1.0.0","dependencies":["core","util"]},{"name":"core","version":"0.3.1","dependencies":[]},{"name":"util","version":"0.2.0","dependencies":["core"]}]}'
stderr = ""

[[case]]
name = "metadata-json-pure-on-tty"
group = "workspace-surface"
stresses = "an attended terminal must not tempt styling into the machine stream"
expected = "pass"
[case.run]
argv = ["metadata", "--output", "json"]
env = { TERM = "xterm-256color" }
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"packages":[{"name":"cli","version":"1.0.0","dependencies":["core","util"]},{"name":"core","version":"0.3.1","dependencies":[]},{"name":"util","version":"0.2.0","dependencies":["core"]}]}'
stdout_not_contains = ["\u001b["]

[[case]]
name = "metadata-package-selection"
group = "workspace-surface"
stresses = "-p narrows the listing to one package"
expected = "pass"
[case.run]
argv = ["metadata", "-p", "util"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "util v0.2.0 deps: core\n"
stderr = ""

[[case]]
name = "tree-default-root"
group = "workspace-surface"
stresses = "nested tree layout with last-child branch and continuation indent"
expected = "pass"
[case.run]
argv = ["tree"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "cli v1.0.0\n├── core v0.3.1\n└── util v0.2.0\n    └── core v0.3.1\n"
stderr = ""

[[case]]
name = "tree-selected-root"
group = "workspace-surface"
stresses = "the same renderer rooted at a selected package"
expected = "pass"
[case.run]
argv = ["tree", "-p", "util"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "util v0.2.0\n└── core v0.3.1\n"

[[case]]
name = "output-term-forces-ansi-when-piped"
group = "workspace-surface"
stresses = "the framework's forced-term mode styles output that a pipe would leave plain"
expected = "pass"
[case.run]
argv = ["metadata", "--output", "term"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_contains = ["\u001b[", "cli", "core", "util"]

