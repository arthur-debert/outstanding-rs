exit_code = 0
stdout = "build.features = []\nbuild.jobs = 1\nbuild.target = wasm32\nnet.offline = false\nterm.color = auto\nterm.output = auto\n"

# --- config values reaching a rendered view ----------------------------------

[[case]]
name = "config-values-reach-the-build-view"
group = "config-reaches-the-view"
stresses = "a command's rendered bytes are a projection of the effective config"
expected = "fail"
gap = "PAR01"
reason = "config-file discovery is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["build", "-p", "cli"]
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\njobs = 3\nfeatures = [\"tls\"]\n"
[case.expect]
exit_code = 0
stdout = "compile cli v1.0.0 jobs=3 features=[tls]\n"

[[case]]
name = "features-flag-appends-to-the-config-list"
group = "config-reaches-the-view"
stresses = "the flag layer appends to a file-supplied list rather than replacing it"
expected = "fail"
gap = "PAR01"
reason = "config-file discovery is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["build", "-p", "cli", "--features", "fast"]
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\nfeatures = [\"tls\"]\n"
[case.expect]
exit_code = 0
stdout = "compile cli v1.0.0 jobs=1 features=[tls,fast]\n"

# --- ROB01 invariant matrix --------------------------------------------------
# Read-only commands the runner sweeps across output modes (text/term/json),
# piped, on top of the case suite (format: corpus/README.md). Failures here are
# framework findings by default.

[invariants]
modes = ["text", "term", "json"]
colors = ["off", "on"]

[[invariants.theme]]
name = "application"

[[invariants.command]]
argv = ["metadata"]
contract = "rendered"

[[invariants.command]]
argv = ["tree"]
contract = "rendered"

[[invariants.command]]
argv = ["build"]
contract = "rendered"

[[invariants.command]]
argv = ["config", "list"]
contract = "rendered"
