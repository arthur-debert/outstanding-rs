# --- error vocabulary --------------------------------------------------------

[[case]]
name = "unknown-package-exits-101"
group = "errors"
stresses = "a workspace error takes the domain exit code, stdout stays empty"
expected = "pass"
[case.run]
argv = ["build", "-p", "nope"]
timeout_seconds = 10
[case.expect]
exit_code = 101
stdout = ""
stderr = "cargolike: no package named nope in the workspace\n"

[[case]]
name = "unknown-config-key-is-usage-error"
group = "errors"
stresses = "a key outside the known set is a usage error, not a domain error"
expected = "pass"
[case.run]
argv = ["config", "get", "build.nope"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["build.nope"]

[[case]]
name = "malformed-config-override-is-usage-error"
group = "errors"
stresses = "a --config argument without = is rejected before anything is resolved"
expected = "pass"
[case.run]
argv = ["metadata", "--config", "build.jobs"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["build.jobs"]

[[case]]
name = "invalid-flag-value-exits-101"
group = "errors"
stresses = "value text that does not fit the key's type is a configuration error from every layer, not a usage error"
expected = "pass"
[case.run]
argv = ["build", "--jobs", "many"]
timeout_seconds = 10
[case.expect]
exit_code = 101
stdout = ""
stderr_contains = ["build.jobs"]

[[case]]
name = "config-get-unset-key-is-quiet-exit-1"
group = "errors"
stresses = "a known key with no effective value is a quiet exit-1, both streams empty"
expected = "pass"
[case.run]
argv = ["config", "get", "build.target"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = ""

# --- per-type merge across discovered files ----------------------------------
# Specced past current capability: standout has no config layer, and this
# archetype's merge rule (every file contributes, per type) is the shape
# PAR01 (docs/spec/parity-config-layering.md) has to express.

[[case]]
name = "config-merge-nearest-scalar-wins"
group = "config-merge"
stresses = "walk-up discovery with the nearest file winning a scalar"
expected = "fail"
gap = "PAR01"
reason = "config-file discovery and layering are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.jobs"]
cwd = "project/sub"
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\njobs = 2\n"
"project/sub/.cargolike/config.toml" = "[build]\njobs = 8\n"
[case.expect]
exit_code = 0
stdout = "8\n"

[[case]]
name = "config-merge-arrays-concatenate-across-ancestors"
group = "config-merge"
stresses = "list keys combine across every discovered file instead of the nearest one winning whole"
expected = "fail"
gap = "PAR01"
reason = "per-type merge semantics are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.features"]
cwd = "project/sub"
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\nfeatures = [\"a\"]\n"
"project/sub/.cargolike/config.toml" = "[build]\nfeatures = [\"b\"]\n"
[case.expect]
exit_code = 0
stdout = "[a,b]\n"

[[case]]
name = "config-merge-dedupes-repeated-list-items"
group = "config-merge"
stresses = "a repeated list item collapses to its first occurrence, keeping order"
expected = "fail"
gap = "PAR01"
reason = "per-type merge semantics are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.features"]
cwd = "project/sub"
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\nfeatures = [\"a\", \"b\"]\n"
"project/sub/.cargolike/config.toml" = "[build]\nfeatures = [\"b\", \"c\"]\n"
[case.expect]
exit_code = 0
stdout = "[a,b,c]\n"

[[case]]
name = "config-project-scalar-beats-user-file"
group = "config-merge"
stresses = "any project file outranks the user file for a scalar"
expected = "fail"
gap = "PAR01"
reason = "the project/user layer split is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.jobs"]
env = { CARGOLIKE_CONFIG_HOME = "confhome" }
timeout_seconds = 10
[case.run.files]
"confhome/config.toml" = "[build]\njobs = 9\n"
".cargolike/config.toml" = "[build]\njobs = 3\n"
[case.expect]
exit_code = 0
stdout = "3\n"

[[case]]
name = "config-user-list-items-come-first"
group = "config-merge"
stresses = "the same two layers concatenate rather than override for a list, user side first"
expected = "fail"
gap = "PAR01"
reason = "per-type merge semantics are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.features"]
env = { CARGOLIKE_CONFIG_HOME = "confhome" }
timeout_seconds = 10
[case.run.files]
"confhome/config.toml" = "[build]\nfeatures = [\"u\"]\n"
".cargolike/config.toml" = "[build]\nfeatures = [\"p\"]\n"
[case.expect]
exit_code = 0
stdout = "[u,p]\n"

[[case]]
name = "config-user-file-fallback-when-no-project-file"
group = "config-merge"
stresses = "the user file applies when the walk finds nothing"
expected = "fail"
gap = "PAR01"
reason = "config-file discovery is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.jobs"]
env = { CARGOLIKE_CONFIG_HOME = "confhome" }
timeout_seconds = 10
[case.run.files]
"confhome/config.toml" = "[build]\njobs = 7\n"
[case.expect]
exit_code = 0
stdout = "7\n"

[[case]]
name = "invalid-config-value-exits-101"
group = "config-merge"
stresses = "a config file is untrusted input: a wrong-typed value is a named configuration error"
expected = "fail"
gap = "PAR01"
reason = "there is no config layer to validate values against, and no framework-rendered config error (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["build", "-p", "cli"]
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\njobs = \"many\"\n"
[case.expect]
exit_code = 101
stdout = ""
stderr_contains = ["build.jobs"]

# --- the mechanical key↔env mapping ------------------------------------------

[[case]]
name = "env-mapping-beats-merged-files"
group = "key-env-mapping"
stresses = "CARGOLIKE_BUILD_JOBS resolves build.jobs above every file layer"
expected = "fail"
gap = "PAR01"
reason = "a mechanical key-to-environment mapping is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.jobs"]
env = { CARGOLIKE_BUILD_JOBS = "6" }
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\njobs = 2\n"
[case.expect]
exit_code = 0
stdout = "6\n"

[[case]]
name = "env-list-replaces-merged-list"
group = "key-env-mapping"
stresses = "a list from the environment replaces the merged file list instead of appending to it"
expected = "fail"
gap = "PAR01"
reason = "a mechanical key-to-environment mapping with per-type semantics is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.features"]
env = { CARGOLIKE_BUILD_FEATURES = "x,y" }
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\nfeatures = [\"a\"]\n"
[case.expect]
exit_code = 0
stdout = "[x,y]\n"

[[case]]
name = "env-empty-list-clears-merged-list"
group = "key-env-mapping"
stresses = "an empty environment value is the empty list, which is how a caller clears an inherited list"
expected = "fail"
gap = "PAR01"
reason = "a mechanical key-to-environment mapping with per-type semantics is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.features"]
env = { CARGOLIKE_BUILD_FEATURES = "" }
timeout_seconds = 10
[case.run.files]
".cargolike/config.toml" = "[build]\nfeatures = [\"a\"]\n"
[case.expect]
exit_code = 0
stdout = "[]\n"

[[case]]
name = "env-mapping-supplies-build-target"
group = "key-env-mapping"
stresses = "the derived spelling exists for every known key, including one with no default and no flag"
expected = "fail"
gap = "PAR01"
reason = "a mechanical key-to-environment mapping is specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["config", "get", "build.target"]
env = { CARGOLIKE_BUILD_TARGET = "wasm32" }
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "wasm32\n"

# --- framework settings through the config layer -----------------------------

