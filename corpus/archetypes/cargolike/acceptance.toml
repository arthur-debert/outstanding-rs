[[case]]
name = "term-color-never-from-config-on-tty"
group = "framework-settings"
stresses = "a config file key suppresses styling on an attended capable terminal"
expected = "fail"
gap = "PAR01"
reason = "framework settings do not ride a config layer today (docs/spec/parity-config-layering.md)"
