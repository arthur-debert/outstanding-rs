# Acceptance suite for the `ghlike` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (ROB03-WS02).
schema = 1
archetype = "ghlike"

# --- nesting -----------------------------------------------------------------

[[case]]
name = "auth-status-two-levels"
group = "nesting"
stresses = "two-level command dispatch with exact output"
expected = "pass"
[case.run]
argv = ["auth", "status"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "Logged in as corpus-bot\n"
stderr = ""

[[case]]
name = "checks-list-four-levels"
group = "nesting"
stresses = "four-level dispatch (root > pr > checks > list) with a positional at the leaf"
expected = "pass"
[case.run]
argv = ["pr", "checks", "list", "1"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "build pass\nlint  fail\n"
stderr = ""

[[case]]
name = "group-without-subcommand-is-usage-error"
group = "nesting"
stresses = "a group node is not a command: exit 2, guidance on stderr, stdout empty"
expected = "pass"
[case.run]
argv = ["pr"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["Usage"]

[[case]]
name = "deep-group-without-subcommand"
group = "nesting"
stresses = "the same group discipline two levels down"
expected = "pass"
[case.run]
argv = ["pr", "checks"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["Usage"]

[[case]]
name = "unknown-subcommand-is-usage-error"
group = "nesting"
stresses = "unknown leaf under a valid group names the offender"
expected = "pass"
[case.run]
argv = ["pr", "merge"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["merge"]

[[case]]
name = "root-help-lists-groups"
group = "nesting"
stresses = "help at the root shows the top-level nouns and exits 0"
expected = "pass"
[case.run]
argv = ["--help"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_contains = ["auth", "repo", "pr"]
stderr = ""

[[case]]
name = "deep-leaf-help"
group = "nesting"
stresses = "help still renders at nesting depth four"
expected = "pass"
[case.run]
argv = ["pr", "checks", "list", "--help"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_contains = ["Usage"]

# --- human output ------------------------------------------------------------

[[case]]
name = "repo-view-known"
group = "human-output"
stresses = "templated multi-line detail view, plain under pipe"
expected = "pass"
[case.run]
argv = ["repo", "view", "demo/alpha"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "demo/alpha\nAlpha service\nvisibility: public\n"
stderr = ""

[[case]]
name = "repo-view-unknown"
group = "human-output"
stresses = "domain error: stderr prose, empty stdout, exit 1"
expected = "pass"
[case.run]
argv = ["repo", "view", "demo/gamma"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "ghlike: repository not found: demo/gamma\n"

[[case]]
name = "pr-list-human-table"
group = "human-output"
stresses = "padded table with header, exact bytes under pipe"
expected = "pass"
[case.run]
argv = ["pr", "list"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "NUMBER TITLE     STATE\n1      Add pager open\n2      Fix theme merged\n3      Docs pass open\n"

[[case]]
name = "pr-view-human"
group = "human-output"
stresses = "detail view of one record"
expected = "pass"
[case.run]
argv = ["pr", "view", "2"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "#2 Fix theme\nstate: merged\nauthor: bob\n"

[[case]]
name = "pr-view-unknown-number"
group = "human-output"
stresses = "domain error at a deep leaf"
expected = "pass"
[case.run]
argv = ["pr", "view", "9"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "ghlike: no pull request found: 9\n"

# --- machine JSON with field selection ---------------------------------------

[[case]]
name = "pr-list-json-two-fields"
group = "json-field-selection"
stresses = "field selection projects exactly the requested keys, typed"
expected = "pass"
[case.run]
argv = ["pr", "list", "--json", "number,title"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '[{"number":1,"title":"Add pager"},{"number":2,"title":"Fix theme"},{"number":3,"title":"Docs pass"}]'
stderr = ""

[[case]]
name = "pr-list-json-single-field"
group = "json-field-selection"
stresses = "a one-field projection is still an array of objects, not bare values"
expected = "pass"
[case.run]
argv = ["pr", "list", "--json", "number"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '[{"number":1},{"number":2},{"number":3}]'

[[case]]
name = "pr-view-json-all-fields"
group = "json-field-selection"
stresses = "object projection with typed number/bool fields"
expected = "pass"
[case.run]
argv = ["pr", "view", "2", "--json", "number,title,state,author,draft"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"number":2,"title":"Fix theme","state":"merged","author":"bob","draft":false}'

[[case]]
name = "checks-json-at-depth-four"
group = "json-field-selection"
stresses = "structured output through a deeply nested leaf"
expected = "pass"
[case.run]
argv = ["pr", "checks", "list", "1", "--json", "name,status"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '[{"name":"build","status":"pass"},{"name":"lint","status":"fail"}]'

[[case]]
name = "json-is-pure-on-attended-terminal"
group = "json-field-selection"
stresses = "structured mode vs TTY color autodetection: JSON is never styled or framed"
expected = "pass"
[case.run]
argv = ["pr", "list", "--json", "number,state"]
env = { TERM = "xterm-256color" }
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '[{"number":1,"state":"open"},{"number":2,"state":"merged"},{"number":3,"state":"open"}]'
stdout_not_contains = ["\u001b["]

[[case]]
name = "unknown-json-field-lists-valid-ones"
group = "json-field-selection"
stresses = "field-selection rejection names the offender and the valid vocabulary, stdout stays empty"
expected = "pass"
[case.run]
argv = ["pr", "list", "--json", "bogus"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr_contains = ["bogus", "number", "title"]
