tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "UNIT          LOAD   ACTIVE   SUB\ncore.service  loaded active   running\nweb.service   loaded active   running\ncache.service loaded inactive dead\nbackup.timer  loaded active   waiting\n\n4 units listed.\n"

# --- pager discipline --------------------------------------------------------

[[case]]
name = "pager-on-tty"
group = "pager"
stresses = "pager spawn on attended stdout, observed through the pager's filtering"
expected = "pass"
[case.run]
argv = ["list-units"]
env = { SYSTEMDLIKE_PAGER = "sed -n 1p", NO_COLOR = "1" }
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "UNIT          LOAD   ACTIVE   SUB\n"

[[case]]
name = "no-pager-flag"
group = "pager"
stresses = "--no-pager suppresses a configured pager on a TTY"
expected = "pass"
[case.run]
argv = ["list-units", "--no-pager"]
env = { SYSTEMDLIKE_PAGER = "sed -n 1p", NO_COLOR = "1" }
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "UNIT          LOAD   ACTIVE   SUB\ncore.service  loaded active   running\nweb.service   loaded active   running\ncache.service loaded inactive dead\nbackup.timer  loaded active   waiting\n\n4 units listed.\n"

[[case]]
name = "piped-never-pages"
group = "pager"
stresses = "captured (piped) stdout must not spawn the pager"
expected = "pass"
[case.run]
argv = ["list-units"]
env = { PAGER = "sed -n 1p" }
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "UNIT          LOAD   ACTIVE   SUB\ncore.service  loaded active   running\nweb.service   loaded active   running\ncache.service loaded inactive dead\nbackup.timer  loaded active   waiting\n\n4 units listed.\n"

# --- usage errors ------------------------------------------------------------

[[case]]
name = "bad-state-value-usage-error"
stresses = "bad enum value is a usage error: exit 2, stderr only"
expected = "pass"
[case.run]
argv = ["list-units", "--state", "bogus"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["Usage"]
