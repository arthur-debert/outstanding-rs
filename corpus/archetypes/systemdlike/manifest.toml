# Feature/interaction manifest for `systemdlike`. Format: corpus/README.md.

[archetype]
name = "systemdlike"
survey = "C5"
summary = "naked default command, --plain/--no-legend, color and pager environment discipline"
status = "in-capability"

[features]
used = [
    "dispatch.default-command",
    "dispatch.handler-macro",
    "view-helpers.list-view",
    "tabular.column-formatting",
    "output-modes.auto-degradation",
    "output-modes.color-flag",
    "styling.no-color",
    "help.pager-display",
]

[[interactions]]
id = "naked-default-vs-flags"
stresses = ["default command resolution", "flags on a naked invocation", "refused-line handoff (ADR-0018)"]
description = "The naked line must be the same command as the spelled-out one, including flags parsed off a line that selects no subcommand — the resolution path where a root requiring a subcommand still accepts a naked invocation."
cases = ["naked-default-lists-units", "explicit-list-units-identical", "naked-invocation-carries-flags"]

[[interactions]]
id = "listview-framing-vs-legend-suppression"
stresses = ["ListView intro/total/status", "legend suppression", "filter summary", "tabular width strategies"]
description = "ListView's framing (header, count footer) must be separable from its data rows, and column widths must be recomputed over exactly the rendered rows — filtering changes both the count and the geometry."
cases = ["state-filter-recomputes-widths-and-count", "state-inactive-no-legend", "plain-piped-identical-to-default", "naked-invocation-carries-flags"]

[[interactions]]
id = "three-way-color-precedence"
stresses = ["tool-specific color variable", "NO_COLOR", "--plain flag", "TTY capability autodetection"]
description = "Four color signals with a strict precedence: explicit flag > SYSTEMDLIKE_COLORS > NO_COLOR > autodetect. Every pairwise override is asserted; the framework's color gating must be composable enough to express a tool variable that outranks NO_COLOR. The two explicit-flag overrides are spelled `--color never`/`always` since TERM01-WS05."
cases = [
    "color-on-capable-tty",
    "no-color-var-suppresses-on-tty",
    "tool-var-beats-no-color",
    "tool-var-forces-color-when-piped",
    "tool-var-zero-beats-capable-tty",
    "plain-beats-tool-var",
    "output-text-beats-tool-var",
    "output-term-beats-everything-when-piped",
]

[[interactions]]
id = "pager-vs-captured-output"
stresses = ["pager spawn", "TTY detection", "tool-specific pager variable"]
description = "Pager engagement keys off stdout attendance and must not fire on captured output; the tool pager variable and --no-pager both steer it."
cases = ["pager-on-tty", "no-pager-flag", "piped-never-pages"]
