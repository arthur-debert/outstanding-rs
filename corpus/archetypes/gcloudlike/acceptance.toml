name = "active-set-feeds-the-view"
group = "config-layering"
stresses = "a stored property of the active set reaches a nested domain view"
expected = "fail"
gap = "PAR05"
reason = "named configuration sets are specced past current framework capability (docs/spec/parity-named-config-sets.md, PAR05)"
[case.run]
argv = ["compute", "instances", "list"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = alpha-proj\n"
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"
stderr = ""

