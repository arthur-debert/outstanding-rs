[[case]]
name = "get-value-unset-property"
group = "property-resolution"
stresses = "an unset property is a domain error, both other streams silent"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/account"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: unset property: core/account\n"

[[case]]
name = "get-value-unknown-property-is-domain-error"
group = "property-resolution"
stresses = "a well-formed key outside the property table is a domain error at exit 1"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/nope"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: unknown property: core/nope\n"

[[case]]
