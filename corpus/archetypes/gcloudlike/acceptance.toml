# Acceptance suite for the `gcloudlike` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (ROB07-WS03a).
#
# Scoring boundary for this suite. A case is `expected = "pass"` when a
# spec-correct implementation can answer it without the persisted
# configuration-set store: the store's contents cannot change what the case
# observes, the correct path writes nothing to it, and no explicitly named set
# has to be proven to exist. It is `expected = "fail"` (gap PAR05) when any of
# those three is untrue — the store deciding an output, a write, or the
# existence check the spec demands of every name but `default`.
#
# So a case that fixtures a store and is answered by a higher-precedence flag
# or variable stays `"pass"` only while nothing else pulls the store onto the
# correct path: `--configuration prod` does pull it in (an absent `prod` is a
# domain error), while `--configuration default` does not, since `default`
# exists by rule whether or not a file backs it.
schema = 1
archetype = "gcloudlike"

# --- the inventory view, fed from argv alone ---------------------------------

[[case]]
name = "instances-list-project-flag"
group = "inventory"
stresses = "a nested leaf renders from a property supplied by its per-invocation flag"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"
stderr = ""

[[case]]
name = "instances-list-project-and-zone-flags"
group = "inventory"
stresses = "two properties narrow the same view"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj", "--zone", "us-a1"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\n"
stderr = ""

[[case]]
name = "instances-list-unset-project-is-domain-error"
group = "inventory"
stresses = "a view whose required property resolves to nothing fails as a domain error, stdout untouched"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: unset property: core/project\n"

[[case]]
name = "instances-describe-project-flag"
group = "inventory"
stresses = "detail view of one record under the same effective property"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "web-1", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "name: web-1\nproject: alpha-proj\nzone: us-a1\nmachine_type: small\nstatus: RUNNING\n"
stderr = ""

[[case]]
name = "instances-describe-unknown-name"
group = "inventory"
stresses = "unknown record is a domain error at exit 1, not a usage error"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "nope", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: no such instance: nope\n"

[[case]]
name = "instances-describe-outside-effective-project"
group = "inventory"
stresses = "the effective project scopes lookup: an existing name outside it is not found"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "db-1", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: no such instance: db-1\n"

