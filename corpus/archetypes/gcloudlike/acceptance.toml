# --- precedence above a fixtured store: the store is never on the answer path

[[case]]
name = "flag-property-beats-active-set"
group = "config-layering"
stresses = "flag layer over the active set's stored value"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = beta-proj\n"
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"
stderr = ""

[[case]]
name = "env-property-beats-active-set"
group = "config-layering"
stresses = "env layer over the active set's stored value"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/project"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_CORE_PROJECT = "beta-proj" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = alpha-proj\n"
[case.expect]
exit_code = 0
stdout = "beta-proj\n"
stderr = ""

[[case]]
name = "default-set-flag-does-not-supply-a-property"
group = "config-layering"
stresses = "chain separation with nothing to look up: `default` exists by rule, so a selector flag naming it cannot outrank a variable supplying a property"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/project", "--configuration", "default"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_CORE_PROJECT = "alpha-proj" }
timeout_seconds = 10
[case.run.files]
"conf/configurations/config_default" = "[core]\nproject = gamma-proj\n"
[case.expect]
exit_code = 0
stdout = "alpha-proj\n"
stderr = ""

[[case]]
name = "default-set-env-does-not-supply-a-property"
group = "config-layering"
stresses = "the same separation from the other side: a selector variable naming `default` does not outrank a flag supplying a property"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/project", "--project", "alpha-proj"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_ACTIVE_CONFIG = "default" }
timeout_seconds = 10
[case.run.files]
"conf/configurations/config_default" = "[core]\nproject = gamma-proj\n"
[case.expect]
exit_code = 0
stdout = "alpha-proj\n"
stderr = ""

[[case]]
name = "configuration-flag-does-not-supply-a-property"
group = "config-layering"
stresses = "the selector flag names a set and nothing more: it does not outrank a variable supplying a property"
expected = "fail"
gap = "PAR05"
reason = "naming a set other than `default` obliges the implementation to prove it exists, which is the persisted store (docs/spec/parity-named-config-sets.md, PAR05)"
[case.run]
argv = ["config", "get-value", "core/project", "--configuration", "prod"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_CORE_PROJECT = "alpha-proj" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = gamma-proj\n"
"conf/configurations/config_prod" = "[core]\nproject = beta-proj\n"
[case.expect]
exit_code = 0
stdout = "alpha-proj\n"
stderr = ""

[[case]]
name = "active-config-env-does-not-supply-a-property"
group = "config-layering"
stresses = "the other cross-chain direction: the selector variable does not outrank a flag supplying a property"
expected = "fail"
gap = "PAR05"
reason = "naming a set other than `default` obliges the implementation to prove it exists, which is the persisted store (docs/spec/parity-named-config-sets.md, PAR05)"
[case.run]
argv = ["config", "get-value", "core/project", "--project", "alpha-proj"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_ACTIVE_CONFIG = "prod" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = gamma-proj\n"
"conf/configurations/config_prod" = "[core]\nproject = beta-proj\n"
[case.expect]
exit_code = 0
stdout = "alpha-proj\n"
stderr = ""

# --- named configuration sets (specced past current capability; PAR05) -------
# Standout has no config-file layering feature today; the spec asks for the
# gcloud shape anyway. A blind implementer may hand-roll it (the workaround is
# itself instrumentation signal); a failure here reads as a framework gap for
# the PAR05 named-config-sets epic (docs/spec/parity-named-config-sets.md), not a spec defect.

