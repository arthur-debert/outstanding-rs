reason = "named configuration sets are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["compute", "instances", "list"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "prod\n"
"conf/configurations/config_default" = "[core]\nproject = alpha-proj\n"
"conf/configurations/config_prod" = "[core]\nproject = beta-proj\n"
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\ndb-1 us-a1 large RUNNING\n"

