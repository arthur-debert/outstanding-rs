argv = ["config", "get-value", "compute/zone"]
env = { GCLOUDLIKE_COMPUTE_ZONE = "us-b2" }
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "us-b2\n"
stderr = ""

[[case]]
