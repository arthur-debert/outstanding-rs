# --- ROB01 invariant matrix --------------------------------------------------
# Read-only commands the runner sweeps across output modes (text/term/json),
# piped, on top of the case suite (format: corpus/README.md, Manifest/Run
# semantics). Both are argv-only, so the matrix never depends on a store the
# sandbox does not fixture. Failures here are framework findings by default.

[invariants]
modes = ["text", "term", "json"]
colors = ["off", "on"]

[[invariants.theme]]
name = "application"

[[invariants.command]]
argv = ["compute", "instances", "list", "--project", "alpha-proj"]
contract = "rendered"

[[invariants.command]]
argv = ["compute", "instances", "describe", "web-1", "--project", "alpha-proj"]
contract = "rendered"
