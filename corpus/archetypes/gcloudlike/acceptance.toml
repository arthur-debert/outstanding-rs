[[case]]
name = "set-unknown-property-is-domain-error"
group = "property-resolution"
stresses = "the write path validates the key before it touches the store"
expected = "pass"
[case.run]
argv = ["config", "set", "core/nope", "x"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: unknown property: core/nope\n"

[[case]]
name = "unknown-subcommand-is-usage-error"
group = "property-resolution"
stresses = "an unknown leaf under a valid group names the offender at exit 2"
expected = "pass"
[case.run]
argv = ["compute", "widgets", "list"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["widgets"]

# --- precedence above a fixtured store: the store is never on the answer path

[[case]]
name = "flag-property-beats-active-set"
group = "config-layering"
stresses = "flag layer over the active set's stored value"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = beta-proj\n"
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"

[[case]]
name = "env-property-beats-active-set"
group = "config-layering"
stresses = "env layer over the active set's stored value"
expected = "pass"
[case.run]
argv = ["config", "get-value", "core/project"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf", GCLOUDLIKE_CORE_PROJECT = "beta-proj" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = alpha-proj\n"
[case.expect]
exit_code = 0
stdout = "beta-proj\n"

# --- named configuration sets (specced past current capability; PAR01) -------
# Standout has no config-file layering feature today; the spec asks for the
# gcloud shape anyway. A blind implementer may hand-roll it (the workaround is
# itself instrumentation signal); a failure here reads as a framework gap for
# the parity-config-layering epic, not a spec defect.

[[case]]
name = "active-set-feeds-the-view"
group = "config-layering"
stresses = "a stored property of the active set reaches a nested domain view"
expected = "fail"
gap = "PAR01"
reason = "named configuration sets are specced past current framework capability (docs/spec/parity-config-layering.md)"
[case.run]
argv = ["compute", "instances", "list"]
env = { GCLOUDLIKE_CONFIG_DIR = "conf" }
timeout_seconds = 10
[case.run.files]
"conf/active_config" = "default\n"
"conf/configurations/config_default" = "[core]\nproject = alpha-proj\n"
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"

[[case]]
name = "active-config-file-selects-the-set"
group = "config-layering"
stresses = "the persisted active name picks which whole set applies"
