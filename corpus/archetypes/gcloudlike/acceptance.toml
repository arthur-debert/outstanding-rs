# Acceptance suite for the `gcloudlike` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (ROB07-WS03a).
#
# Scoring boundary for this suite: a case is `expected = "pass"` when a
# spec-correct implementation can produce the expected output without touching
# the persisted configuration-set store, and `expected = "fail"` (gap PAR01)
# when it cannot. Cases that fixture a store but are answered by a
# higher-precedence flag or environment variable therefore stay `"pass"` —
# reading the store is never on the correct path.
schema = 1
archetype = "gcloudlike"

# --- the inventory view, fed from argv alone ---------------------------------

[[case]]
name = "instances-list-project-flag"
group = "inventory"
stresses = "a nested leaf renders from a property supplied by its per-invocation flag"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\nweb-2 us-b2 small TERMINATED\n"
stderr = ""

[[case]]
name = "instances-list-project-and-zone-flags"
group = "inventory"
stresses = "two properties narrow the same view"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj", "--zone", "us-a1"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "NAME ZONE MACHINE_TYPE STATUS\nweb-1 us-a1 small RUNNING\n"
stderr = ""

[[case]]
name = "instances-list-unset-project-is-domain-error"
group = "inventory"
stresses = "a view whose required property resolves to nothing fails as a domain error, stdout untouched"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: unset property: core/project\n"

[[case]]
name = "instances-describe-project-flag"
group = "inventory"
stresses = "detail view of one record under the same effective property"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "web-1", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "name: web-1\nproject: alpha-proj\nzone: us-a1\nmachine_type: small\nstatus: RUNNING\n"
stderr = ""

[[case]]
name = "instances-describe-unknown-name"
group = "inventory"
stresses = "unknown record is a domain error at exit 1, not a usage error"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "nope", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: no such instance: nope\n"

[[case]]
name = "instances-describe-outside-effective-project"
group = "inventory"
stresses = "the effective project scopes lookup: an existing name outside it is not found"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "db-1", "--project", "alpha-proj"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "gcloudlike: no such instance: db-1\n"

# --- the app's own --format flag over the framework's output pipeline --------

[[case]]
name = "instances-list-json-format"
group = "machine-format"
stresses = "the app's --format json projection replaces the human form entirely"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj", "--format", "json"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"instances":[{"name":"web-1","zone":"us-a1","machine_type":"small","status":"RUNNING"},{"name":"web-2","zone":"us-b2","machine_type":"small","status":"TERMINATED"}]}'

[[case]]
name = "instances-describe-json-format"
group = "machine-format"
stresses = "the same projection at the detail leaf"
expected = "pass"
[case.run]
argv = ["compute", "instances", "describe", "web-1", "--project", "alpha-proj", "--format", "json"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"name":"web-1","project":"alpha-proj","zone":"us-a1","machine_type":"small","status":"RUNNING"}'

[[case]]
name = "instances-list-json-pure-on-attended-terminal"
group = "machine-format"
stresses = "an attended terminal must not tempt styling into the app's machine projection"
expected = "pass"
[case.run]
argv = ["compute", "instances", "list", "--project", "alpha-proj", "--format", "json"]
tty = ["stdout"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '{"instances":[{"name":"web-1","zone":"us-a1","machine_type":"small","status":"RUNNING"},{"name":"web-2","zone":"us-b2","machine_type":"small","status":"TERMINATED"}]}'
stdout_not_contains = ["\u001b["]

# --- property resolution above the store ------------------------------------

[[case]]
