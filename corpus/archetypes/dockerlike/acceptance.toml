# --- ROB01 invariant matrix --------------------------------------------------
# Read-only commands the runner sweeps across output modes (text/term/json),
# piped. Failures here are framework findings by default.

[invariants]
modes = ["text", "term", "json"]
colors = ["off", "on"]

[[invariants.theme]]
name = "application"

[[invariants.command]]
argv = ["ps"]
contract = "rendered"

[[invariants.command]]
argv = ["container", "ls"]
contract = "rendered"

[[invariants.command]]
argv = ["images"]
contract = "rendered"

[[invariants.command]]
argv = ["image", "ls"]
contract = "rendered"

[[invariants.command]]
argv = ["ps", "-q"]
contract = "rendered"

[[invariants.command]]
argv = ["inspect", "web"]
contract = "opaque-bytes"

[[invariants.command]]
argv = ["container", "inspect", "web"]
contract = "opaque-bytes"
