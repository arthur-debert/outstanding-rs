timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "3f1a9c2b7d4e\n7b2e5a8f0c13\n3f8d4e6a1b90\nc04b17e9a2f5\n"
stdout_not_contains = ["\u001b[", "CONTAINER ID"]
stderr = ""

[[case]]
name = "quiet-under-forced-term-is-unstyled"
group = "quiet-contract"
stresses = "an unconditional --output=term has nothing to style in quiet output"
expected = "pass"
[case.run]
argv = ["ps", "-q", "--output", "term"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "3f1a9c2b7d4e\n7b2e5a8f0c13\n3f8d4e6a1b90\nc04b17e9a2f5\n"
stdout_not_contains = ["\u001b["]
stderr = ""

[[case]]
