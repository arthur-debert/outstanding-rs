stresses = "the management path of the machine-only command carries the same diagnostic"
expected = "pass"
[case.run]
argv = ["container", "inspect", "nope"]
timeout_seconds = 10
[case.expect]
exit_code = 1
stdout = ""
stderr = "dockerlike: no such object: nope\n"

[[case]]
name = "container-group-without-subcommand"
group = "alias-identity"
stresses = "a management group is not a command: exit 2, guidance on stderr, stdout empty"
expected = "pass"
[case.run]
argv = ["container"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["Usage"]

[[case]]
name = "image-group-without-subcommand"
group = "alias-identity"
stresses = "the same group discipline on the second group"
expected = "pass"
[case.run]
argv = ["image"]
timeout_seconds = 10
[case.expect]
exit_code = 2
stdout = ""
stderr_contains = ["Usage"]

[[case]]
name = "root-without-command-is-usage-error"
