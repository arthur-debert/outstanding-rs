# Acceptance suite for the `dockerlike` archetype. Format: corpus/README.md.
# Written spec-first, before any implementation exists (ROB07-WS03b).
schema = 1
archetype = "dockerlike"

# --- alias identity ----------------------------------------------------------

[[case]]
name = "ps-lists-containers"
group = "alias-identity"
stresses = "the legacy top-level verb renders the padded container table exactly"
expected = "pass"
[case.run]
argv = ["ps"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "CONTAINER ID NAME  IMAGE       STATE\n3f1a9c2b7d4e web   alpine:3.19 running\n7b2e5a8f0c13 api   alpine:3.19 running\n3f8d4e6a1b90 db    postgres:16 exited\nc04b17e9a2f5 cache redis:7     exited\n"
stderr = ""

[[case]]
name = "container-ls-is-identical-to-ps"
group = "alias-identity"
stresses = "the management path produces the same bytes as its legacy alias"
expected = "pass"
[case.run]
argv = ["container", "ls"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "CONTAINER ID NAME  IMAGE       STATE\n3f1a9c2b7d4e web   alpine:3.19 running\n7b2e5a8f0c13 api   alpine:3.19 running\n3f8d4e6a1b90 db    postgres:16 exited\nc04b17e9a2f5 cache redis:7     exited\n"
stderr = ""

[[case]]
name = "images-lists-images"
group = "alias-identity"
stresses = "a second table under a second legacy verb, header wider than its data"
expected = "pass"
[case.run]
argv = ["images"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "IMAGE ID     REPOSITORY TAG  SIZE\na1b2c3d4e5f6 alpine     3.19 7.4MB\nb9c8d7e6f5a4 postgres   16   431MB\ne5f4a3b2c1d0 redis      7    41MB\n"
stderr = ""

[[case]]
name = "image-ls-is-identical-to-images"
group = "alias-identity"
stresses = "the second management path matches its legacy alias byte for byte"
expected = "pass"
[case.run]
argv = ["image", "ls"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "IMAGE ID     REPOSITORY TAG  SIZE\na1b2c3d4e5f6 alpine     3.19 7.4MB\nb9c8d7e6f5a4 postgres   16   431MB\ne5f4a3b2c1d0 redis      7    41MB\n"
stderr = ""

[[case]]
name = "image-ls-no-trunc-is-identical"
group = "alias-identity"
stresses = "the management path widens to the same bytes"
expected = "pass"
[case.run]
argv = ["image", "ls", "--no-trunc"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "IMAGE ID         REPOSITORY TAG  SIZE\na1b2c3d4e5f60718 alpine     3.19 7.4MB\nb9c8d7e6f5a40312 postgres   16   431MB\ne5f4a3b2c1d09876 redis      7    41MB\n"
stderr = ""

[[case]]
name = "image-ls-json-is-identical-to-images"
group = "alias-identity"
stresses = "the management path serializes the same image records"
expected = "pass"
[case.run]
argv = ["image", "ls", "--output", "json"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '[{"id":"a1b2c3d4e5f60718","repository":"alpine","tag":"3.19","size":"7.4MB"},{"id":"b9c8d7e6f5a40312","repository":"postgres","tag":"16","size":"431MB"},{"id":"e5f4a3b2c1d09876","repository":"redis","tag":"7","size":"41MB"}]'
stderr = ""

[[case]]
name = "image-ls-quiet-json-is-identical"
group = "alias-identity"
stresses = "the management path serializes the same quiet value"
expected = "pass"
[case.run]
argv = ["image", "ls", "-q", "--output", "json"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout_json = '["a1b2c3d4e5f60718","b9c8d7e6f5a40312","e5f4a3b2c1d09876"]'
stderr = ""

[[case]]
name = "ps-quiet-filtered"
group = "alias-identity"
stresses = "flags parse and apply on the legacy verb"
expected = "pass"
[case.run]
argv = ["ps", "-q", "--filter", "state=exited"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "3f8d4e6a1b90\nc04b17e9a2f5\n"
stderr = ""

[[case]]
name = "container-ls-quiet-filtered-identical"
group = "alias-identity"
stresses = "the same flags on the management path produce the same bytes"
expected = "pass"
[case.run]
argv = ["container", "ls", "-q", "--filter", "state=exited"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "3f8d4e6a1b90\nc04b17e9a2f5\n"
stderr = ""

[[case]]
