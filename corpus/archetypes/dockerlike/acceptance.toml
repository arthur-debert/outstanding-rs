# --- quiet as a data-shape choice --------------------------------------------

[[case]]
name = "quiet-lists-bare-ids"
group = "quiet-contract"
stresses = "--quiet drops the header and the padding, leaving one id per line"
expected = "pass"
[case.run]
argv = ["ps", "-q"]
timeout_seconds = 10
[case.expect]
exit_code = 0
stdout = "3f1a9c2b7d4e\n7b2e5a8f0c13\n3f8d4e6a1b90\nc04b17e9a2f5\n"
stderr = ""

[[case]]
name = "quiet-long-flag-is-identical"
group = "quiet-contract"
stresses = "the long spelling of the quiet flag is the same command"
