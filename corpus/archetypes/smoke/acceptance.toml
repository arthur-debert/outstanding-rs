# Acceptance suite for the smoke archetype, written before any implementation
# (spec-first: "did it work" is never judged by the implementer). The runner
# executes each case against the produced binary and records its outcome in
# the run report, separate from the agent's self-assessment.

schema = 1
archetype = "smoke"

[[case]]
name = "list-renders-heading-and-every-star-row"
stresses = "table rendering of the fixed catalog"
expected = "pass"
[case.run]
argv = ["list", "--output", "text"]
timeout_seconds = 30
[case.expect]
exit_code = 0
stdout_contains = [
    "Star Catalog",
    "Aldebaran",
    "Taurus",
    "Rigel",
    "Orion",
    "Vega",
    "Lyra",
]

[[case]]
name = "list-binds-each-star-to-its-own-row"
stresses = "row association in the rendered table"
expected = "pass"
[case.run]
argv = ["list", "--output", "text"]
timeout_seconds = 30
[case.expect]
exit_code = 0
# Row association, not a bag of substrings: each group must co-occur on one
# single output line, so a table that shuffles columns across rows fails.
stdout_row_contains = [
    ["Aldebaran", "Taurus", "0.86"],
    ["Rigel", "Orion", "0.13"],
    ["Vega", "Lyra", "0.03"],
]

[[case]]
name = "list-emits-complete-json-star-rows"
stresses = "machine JSON carrying complete star rows"
expected = "pass"
[case.run]
argv = ["list", "--output", "json"]
timeout_seconds = 30
[case.expect]
exit_code = 0
# Each group must co-occur inside one single JSON array element (numbers
# match their decimal literal), so `["Aldebaran","Rigel","Vega"]` alone —
# names without constellations or magnitudes — fails.
stdout_json_rows = [
    ["Aldebaran", "Taurus", "0.86"],
    ["Rigel", "Orion", "0.13"],
    ["Vega", "Lyra", "0.03"],
]

[[case]]
name = "about-names-the-tool"
stresses = "single-line about output"
expected = "pass"
[case.run]
argv = ["about", "--output", "text"]
timeout_seconds = 30
[case.expect]
exit_code = 0
stdout_contains = ["smoke"]

# The ROB01 invariant matrix runs each listed command across output modes
# (text, term, json): exit 0 everywhere, no unresolved [tag?] markers, term
# stripped of escapes must equal text byte-for-byte, json must parse.
[invariants]
modes = ["text", "term", "json"]
colors = ["off", "on"]

[[invariants.theme]]
name = "application"

[[invariants.command]]
argv = ["list"]
contract = "rendered"

[[invariants.command]]
argv = ["about"]
contract = "rendered"
