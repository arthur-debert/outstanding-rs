[package]
name = "corpus-gap-suites"
version = "10.0.0"
edition = "2021"
description = "Expected-fail acceptance suites for the corpus gap archetypes (tflike, jjlike)"
license = "MIT"
publish = false

[[bin]]
name = "tflike"
path = "src/bin/tflike.rs"

[dependencies]
serde_json = "1"
# The tflike fixture only; the harness library links none of these.
anyhow = "1"
clap = "4"
serde = { version = "1", features = ["derive"] }
standout = { path = "../../crates/standout" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
