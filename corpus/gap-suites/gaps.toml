# The closed-gap ledger: one entry per gap-suite milestone group, the
# epic-close checklist the parity program cannot skip. `tests/tripwire.rs`
# enforces this file against the suites themselves on every `pixi run test`:
#
# - `armed` must equal the number of `expect_gap` assertions in `tests`
#   (deleting or bypassing a tripwire without recording it here is a red
#   test, so the net cannot erode silently);
# - `status = "open"` requires the suite to still carry its `expect_gap`
#   wrappers;
# - `status = "closed"` (with `armed = 0`) requires them gone — the closing
#   epic must promote the suite (remove the wrappers, making the assertions
#   plain requirements) in the same change that flips this entry, and cannot
#   flip the entry without doing so.
#
# Running a suite against a produced binary is what detects closure
# (`expect_gap` fails loudly on an unexpected pass); this ledger is what
# makes acting on that detection non-optional at epic close. See
# corpus/gap-suites/README.md.

[[gate]]
name = "tflike/diagnostic"
epic = "PAR02 (machine contract)"
env = "CORPUS_TFLIKE_BIN"
tests = "tests/tflike_diagnostic.rs"
status = "closed"
armed = 0

[[gate]]
name = "tflike/progress"
epic = "PAR03 (terminal citizenship)"
env = "CORPUS_TFLIKE_BIN"
tests = "tests/tflike_progress.rs"
status = "open"
armed = 3

[[gate]]
name = "jjlike/runtime-templates"
epic = "not yet minted (codes are human-assigned)"
env = "CORPUS_JJLIKE_BIN"
tests = "tests/jjlike.rs"
status = "open"
armed = 8
