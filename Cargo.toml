[workspace]
resolver = "2"
members = [
    "crates/standout",
    "crates/standout-bbparser",
    "crates/standout-dispatch",
    "crates/standout-docs",
    "crates/standout-fixtures",
    "crates/standout-input",
    "crates/standout-macros",
    "crates/standout-render",
    "crates/standout-pipe",
    "crates/standout-seeker",
    "crates/standout-test",
    "crates/standout-types",
    "crates/todo-example/todo-core",
    "crates/todo-example/tdoo",
]

[workspace.package]
version = "13.0.5"

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
tag-prefix = ""
pre-release-commit-message = "Release {{version}}"
